<!doctype html>
<html lang="fa" dir="rtl" data-skin="jarvis">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="skins.css">
<style>
  @font-face { font-family: 'Vazirmatn'; src: url('fonts/Vazirmatn-Variable.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: 'Orbitron'; src: url('fonts/Orbitron-Variable.ttf'); font-weight: 400 900; font-display: swap; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--color-bg, #020A12); color: var(--color-fg, #DDF6FF); font-family: Vazirmatn, system-ui, sans-serif; }
  body { background: radial-gradient(ellipse at 50% 44%, color-mix(in srgb, var(--color-primary) 10%, transparent), transparent 60%), var(--color-bg, #020A12); }
  body.idle-cursor, body.idle-cursor * { cursor: none; }
  .grid { position: fixed; inset: 0; background-image: linear-gradient(var(--color-grid, rgb(79 216 255 / .05)) 1px, transparent 1px), linear-gradient(90deg, var(--color-grid, rgb(79 216 255 / .05)) 1px, transparent 1px); background-size: 6vmin 6vmin; mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%); pointer-events: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .hit { position: fixed; left: 50%; top: 44%; width: 44vmin; height: 44vmin; transform: translate(-50%, -50%); border-radius: 50%; border: 0; background: transparent; cursor: pointer; }
  .hit:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 8px; }
  header { position: fixed; top: 4vmin; inset-inline: 5vmin; display: flex; justify-content: space-between; align-items: baseline; pointer-events: none; }
  .brand { font: 700 clamp(18px, 2.6vmin, 40px)/1 Orbitron, ui-monospace, monospace; letter-spacing: .5em; color: var(--color-primary); text-shadow: 0 0 18px var(--color-glow, rgb(79 216 255 / .5)); direction: ltr; }
  .clock { text-align: end; direction: ltr; }
  .clock b { display: block; font: 300 clamp(28px, 6.5vmin, 104px)/1 Vazirmatn, system-ui, sans-serif; color: var(--color-fg-strong, #fff); font-variant-numeric: tabular-nums; }
  .clock span { font-size: clamp(13px, 1.8vmin, 26px); color: var(--color-fg-muted); direction: rtl; display: block; margin-top: .6vmin; }
  footer { position: fixed; bottom: 6vmin; inset-inline: 8vmin; text-align: center; pointer-events: none; }
  #state { margin: 0; font-weight: 600; font-size: clamp(20px, 3.4vmin, 56px); color: var(--color-primary); letter-spacing: .02em; }
  #caption { margin: 2vmin auto 0; max-width: 70ch; font-size: clamp(18px, 2.8vmin, 44px); line-height: 1.6; color: var(--color-fg); min-height: 1.6em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; transition: opacity .3s; }
  #caption.you { color: var(--color-fg-muted); }
  .hint { position: fixed; bottom: 2vmin; inset-inline-start: 2vmin; font-size: 13px; color: var(--color-fg-muted); opacity: .6; }
  @media (prefers-reduced-motion: reduce) { #caption { transition: none; } }
</style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <canvas id="orb" aria-hidden="true"></canvas>
  <button class="hit" id="hit" aria-label="روی گوی بزنید تا صحبت کنید"></button>
  <header><div class="brand">J.A.R.V.I.S</div><div class="clock"><b id="time"></b><span id="date"></span></div></header>
  <footer role="status" aria-live="polite"><h1 id="state">منتظر «هی جارویس»</h1><p id="caption" dir="auto"></p></footer>
  <div class="hint" id="hint">Esc برای بستن</div>
  <script src="orb-core.js"></script>
  <script src="stage.js"></script>
</body>
</html>
