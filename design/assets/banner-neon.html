<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../public/tokens.css">
<link rel="stylesheet" href="assets.css">
<style>
  body { width: 1280px; height: 640px; background: radial-gradient(900px 520px at 78% 50%, rgb(34 211 238 / .16), transparent 62%), radial-gradient(700px 500px at 0% 100%, rgb(167 139 250 / .14), transparent 60%), var(--p-color-slate-950); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgb(148 163 184 / .06) 1px, transparent 1px), linear-gradient(90deg, rgb(148 163 184 / .06) 1px, transparent 1px); background-size: 40px 40px; mask-image: radial-gradient(ellipse at 70% 50%, #000 30%, transparent 75%); }
  .orbit { position: absolute; left: 132px; top: 80px; width: 480px; height: 480px; }
  .wrap { position: absolute; inset: 96px 112px 96px 600px; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  .kicker { font: 600 18px var(--font-mono); letter-spacing: .32em; color: var(--p-color-cyan-400); direction: ltr; text-align: right; }
  h1 { margin: 0; font: 800 64px/1.15 var(--font-sans); color: var(--p-color-slate-50); }
  h1 .c { color: var(--p-color-orange-400); } h1 .x { color: var(--p-color-violet-400); }
  p { margin: 0; font: 400 22px/1.7 var(--font-sans); color: var(--p-color-slate-300); max-width: 520px; }
  .row { display: flex; gap: 14px; align-items: center; margin-top: 10px; }
  .cta { display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 26px; border-radius: 12px; background: var(--p-color-cyan-400); color: var(--p-color-ink); font: 700 19px var(--font-sans); box-shadow: 0 0 32px rgb(34 211 238 / .45); }
  .meta { font: 500 15px var(--font-sans); color: var(--p-color-slate-400); display: flex; gap: 16px; }
  .meta span::before { content: '•'; margin-left: 8px; color: var(--p-color-cyan-400); }
</style></head><body>
<div class="grid"></div>
<svg class="orbit" viewBox="0 0 480 480" aria-hidden="true">
  <defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <circle cx="240" cy="240" r="200" fill="none" stroke="#22D3EE" stroke-opacity=".18" stroke-width="2"/>
  <circle cx="240" cy="240" r="150" fill="none" stroke="#22D3EE" stroke-width="10" stroke-opacity=".9" filter="url(#g)"/>
  <circle cx="240" cy="240" r="104" fill="none" stroke="#22D3EE" stroke-opacity=".55" stroke-width="5" stroke-dasharray="12 13"/>
  <circle cx="240" cy="240" r="52" fill="#22D3EE" filter="url(#g)"/>
  <circle cx="240" cy="240" r="26" fill="#A5F3FC"/>
  <circle cx="240" cy="90" r="24" fill="#FB923C" filter="url(#g)"/>
  <circle cx="240" cy="390" r="24" fill="#A78BFA" filter="url(#g)"/>
  <ellipse cx="240" cy="240" rx="232" ry="70" fill="none" stroke="#FB923C" stroke-opacity=".35" stroke-width="2" transform="rotate(-28 240 240)"/>
  <ellipse cx="240" cy="240" rx="232" ry="70" fill="none" stroke="#A78BFA" stroke-opacity=".35" stroke-width="2" transform="rotate(28 240 240)"/>
</svg>
<div class="wrap">
  <div class="kicker">J A R V I S</div>
  <h1><span class="c">Claude</span> می‌سازد،<br><span class="x">Codex</span> تست می‌کند.</h1>
  <p>دو ایجنت کدنویسی، یک تیم — روی کامپیوتر خودتان. بنویس، تست کن، رفع کن؛ تا تأیید.</p>
  <div class="row"><span class="cta">دانلود برای ویندوز</span>
    <div class="meta"><span>کاملاً محلی</span><span>فارسی</span></div></div>
</div>
</body></html>
